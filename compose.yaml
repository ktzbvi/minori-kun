name: minorikun

x-api-environment: &api-environment
  APP_ENV: local
  APP_URL: http://localhost:${API_PORT:-8000}
  BUSINESS_TIMEZONE: Asia/Tokyo
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-minori}
  DB_USERNAME: ${MYSQL_USER:-minori}
  DB_PASSWORD: ${MYSQL_PASSWORD:-minori_local}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  SANCTUM_STATEFUL_DOMAINS: localhost:${BUYER_PORT:-5173},localhost:${PRODUCER_PORT:-5174},localhost:${ADMIN_PORT:-5175}
  CORS_ALLOWED_ORIGINS: http://localhost:${BUYER_PORT:-5173},http://localhost:${PRODUCER_PORT:-5174},http://localhost:${ADMIN_PORT:-5175}

x-api-volumes: &api-volumes
  - ./apps/api:/var/www/html
  - composer_vendor:/var/www/html/vendor
  - api_storage:/var/www/html/storage

services:
  setup:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    environment:
      <<: *api-environment
    volumes:
      - ./apps/api:/var/www/html
      - ./:/workspace
      - composer_vendor:/var/www/html/vendor
      - api_storage:/var/www/html/storage
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      mysql: { condition: service_healthy }
    user: root
    command: ["sh", "/workspace/docker/php/setup.sh"]
    profiles: ["setup"]

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    environment:
      <<: *api-environment
    volumes: *api-volumes
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-nginx:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine
    ports: ["${API_PORT:-8000}:8080"]
    volumes:
      - ./apps/api:/var/www/html:ro
      - api_storage:/var/www/html/storage:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    ports:
      - "${BUYER_PORT:-5173}:5173"
      - "${PRODUCER_PORT:-5174}:5174"
      - "${ADMIN_PORT:-5175}:5175"
    command: ["pnpm", "dev"]

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minori}
      MYSQL_USER: ${MYSQL_USER:-minori}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-minori_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-minori_root_local}
      TZ: UTC
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["${MAILPIT_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  composer_vendor: { name: minori_composer_vendor }
  node_modules: { name: minori_node_modules }
  pnpm_store: { name: minori_pnpm_store }
  mysql_data:
  api_storage:
